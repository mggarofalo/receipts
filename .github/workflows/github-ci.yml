name: CI

# No workflow-level `paths` filters: they leave required checks pending on a
# PR they exclude. The `changes` job decides which jobs a PR needs instead.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]
    branches: ["main"]

env:
  DOTNET_VERSION: "10.0.401"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: "26.13.0"

jobs:
  pr-title:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          scopes: |
            api
            client
            domain
            application
            infrastructure
            infra
            common
            shared
            ci
            docs
            hooks
          subjectPattern: ^[a-z].*$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter.
            Example: "feat(api): add pagination support"
          ignoreLabels: |
            autorelease: pending
            autorelease: tagged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Classifies a PR's changed files so the jobs below can skip work the PR
  # cannot affect (RECEIPTS-1132). Skipped jobs still satisfy required status
  # checks; a workflow-level `paths` filter would leave them pending instead.
  #
  # Fails open: on push (step skipped) or if detection fails, the outputs are
  # empty, and every consumer tests `!= 'false'`, so everything runs.
  #
  # - backend:  anything that is not client code, Markdown or LICENSE. Deliberately
  #             broad, so an unclassified path (scripts/, .github/, docs/*.json,
  #             Dockerfile, ...) runs the backend jobs.
  # - frontend: client code plus the shared inputs the client reads or is
  #             built by.
  # - api:      inputs of the API Breaking Changes check.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - '**'
              - '!src/client/**'
              - '!**/*.md'
              - '!**/LICENSE'
            frontend:
              - 'src/client/**'
              - 'openapi/**'
              - 'test-data/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Directory.*'
              - 'scripts/**'
              - '.github/**'
              - 'Dockerfile'
              - '.dockerignore'
            api:
              - 'openapi/**'
              - 'scripts/check-breaking.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/**'

  build:
    name: Build & Test
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Receipts.slnx

      - name: Build without runtime secrets
        run: dotnet build Receipts.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Generate server API contract
        run: dotnet run scripts/generate-api-contract.cs

      - name: Test
        run: >-
          dotnet test Receipts.slnx
          --no-build
          --verbosity normal
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --settings scripts/tests/coverlet.runsettings
          --results-directory TestResults

      - name: Merge coverage reports
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/merged
          reporttypes: Cobertura;MarkdownSummaryGithub

      - name: Enforce backend coverage threshold
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: TestResults/merged/Cobertura.xml
          format: markdown
          output: both
          badge: false
          thresholds: '78 70'
          fail_below_min: true

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-backend
          path: TestResults/merged/SummaryGithub.md

  postgres-test:
    name: PostgreSQL Persistence
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run PostgreSQL persistence tests
        run: dotnet run scripts/run-prerequisite-tests.cs -- postgres

  frontend-test:
    name: Frontend Test (Shard ${{ matrix.shard }}/2)
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Gate the steps, not the job: a matrix job skipped by a job-level `if`
    # reports one unexpanded "Shard ${{ matrix.shard }}/2" check, so the
    # required "Frontend Test (Shard N/2)" checks would never report.
    env:
      RUN_FRONTEND: ${{ needs.changes.outputs.frontend != 'false' }}

    steps:
      - name: Skip (no frontend changes)
        if: env.RUN_FRONTEND != 'true'
        run: echo "This PR changes no frontend inputs; skipping the shard."

      - uses: actions/checkout@v6
        if: env.RUN_FRONTEND == 'true'

      - name: Setup Node.js
        if: env.RUN_FRONTEND == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        if: env.RUN_FRONTEND == 'true'
        run: npm ci
        working-directory: src/client

      - name: Build client
        if: env.RUN_FRONTEND == 'true'
        run: npm run build
        working-directory: src/client

      - name: Run tests with coverage
        if: env.RUN_FRONTEND == 'true'
        run: npx vitest run --shard=${{ matrix.shard }}/2 --reporter=blob --coverage
        working-directory: src/client
        env:
          VITEST_SHARD: "true"

      - name: Upload test results
        if: always() && env.RUN_FRONTEND == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-shard-${{ matrix.shard }}
          path: src/client/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  frontend-test-report:
    name: Frontend Coverage Report
    needs: [pr-title, changes, frontend-test]
    if: ${{ !cancelled() && (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'failure') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          path: src/client/.vitest-reports
          pattern: frontend-test-shard-*
          merge-multiple: true

      - name: Merge reports and coverage
        run: npx vitest --merge-reports --coverage
        working-directory: src/client

      - name: Generate coverage summary
        if: success() || failure()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/client/coverage/cobertura-coverage.xml
          format: markdown
          output: both
          badge: false
          thresholds: '80 80'
          fail_below_min: true

      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-frontend
          path: code-coverage-results.md

  visual-regression:
    name: Visual Regression
    needs: [pr-title, changes]
    # Skip when the visual-regression-allowed label is set (intentional
    # baseline-affecting change). See AGENTS.md for the bypass procedure.
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && !contains(github.event.pull_request.labels.*.name, 'visual-regression-allowed') && needs.changes.outputs.frontend != 'false' }}
    # Pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    # Cross-platform pixel diffs (Windows-generated baselines vs Linux CI)
    # are tolerated at the threshold set in playwright.config.ts. Non-
    # blocking for now; flip to blocking after Linux baselines are
    # committed in a follow-up.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/client/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: src/client

      - name: Run visual regression tests
        run: npm run test:visual
        working-directory: src/client

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/client/playwright-report
            src/client/test-results
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && needs.changes.outputs.frontend != 'false' }}
    # Pinned: Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    # Unlike Visual Regression, this job is BLOCKING: it asserts behaviour
    # (which requests fire, what the user is told) against a mocked API, so
    # there is no cross-platform pixel jitter to tolerate. A failure here is
    # a real regression.

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/client/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: src/client

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: src/client

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: |
            src/client/playwright-report
            src/client/test-results
          retention-days: 7

  lint:
    name: Code Formatting
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Receipts.slnx

      - name: Check formatting
        run: dotnet format Receipts.slnx --no-restore --verify-no-changes

  frontend-lint:
    name: Frontend Lint
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      # Enforces the repo-local rules in src/client/eslint-rules/ — notably
      # local/field-row-layout, which blocks the grid-based field rows that
      # let inputs overlap. The pre-commit hook runs the same check, but a
      # --no-verify commit would otherwise reach main unchallenged.
      - name: Lint client
        run: npm run lint
        working-directory: src/client

  security:
    name: Vulnerability Scan
    needs: [pr-title, changes]
    if: ${{ !cancelled() && (needs.pr-title.result == 'success' || needs.pr-title.result == 'skipped') && github.event.action != 'labeled' && github.event.action != 'unlabeled' && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Receipts.slnx

      - name: Check for vulnerable packages
        run: |
          OUTPUT=$(dotnet list Receipts.slnx package --vulnerable 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected!"
            exit 1
          fi

  docker-build:
    name: Docker Build Check
    needs: [pr-title, changes]
    if: ${{ !cancelled() && needs.pr-title.result == 'success' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # GHA-hosted runners ship with ~14GB free disk, which is not enough for
      # the 1.34GB ONNX model download plus image build. Reclaim ~30GB by
      # dropping preinstalled SDKs we don't use (RECEIPTS-671).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=docker-build-check
          cache-to: type=gha,mode=min,scope=docker-build-check

  api-compat:
    name: API Breaking Changes
    needs: [pr-title, changes]
    if: ${{ !cancelled() && needs.pr-title.result == 'success' && !contains(github.event.pull_request.labels.*.name, 'breaking-changes-allowed') && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Check for breaking API changes
        run: node scripts/check-breaking.mjs origin/${{ github.base_ref }}

  # One aggregate gate, meant to become the single required check (RECEIPTS-1132).
  # Fails if any gating job failed or was cancelled, or if a job was skipped
  # although its inputs changed. Skips the filter or a bypass label explains
  # pass. Visual Regression is left out: it is non-blocking (continue-on-error).
  ci-ok:
    name: CI OK
    needs: [pr-title, changes, build, postgres-test, frontend-test, frontend-test-report, e2e, lint, frontend-lint, security, docker-build, api-compat]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          LABEL_EVENT: ${{ github.event.action == 'labeled' || github.event.action == 'unlabeled' }}
          BREAKING_ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-changes-allowed') }}
        run: |
          set -euo pipefail
          fail=0
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }
          # Empty output (push, or detection failed) counts as changed: fail open.
          changed() {
            [ "$(jq -r --arg k "$1" '.changes.outputs[$k] // ""' <<<"$NEEDS")" != false ] && echo true || echo false
          }

          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            r=$(result "$job"); echo "$job: $r"
            case "$r" in failure|cancelled) echo "::error::$job: $r"; fail=1 ;; esac
          done

          # expect <job> <true|false>: when true, the job must not have been skipped.
          expect() {
            if [ "$2" = true ] && [ "$(result "$1")" = skipped ]; then
              echo "::error::$1 was skipped but should have run"; fail=1
            fi
          }
          all() { for c in "$@"; do [ "$c" = true ] || { echo false; return; }; done; echo true; }
          not() { [ "$1" = true ] && echo false || echo true; }

          be=$(changed backend); fe=$(changed frontend); api=$(changed api)
          runs=$(not "$LABEL_EVENT")   # labeled/unlabeled events suppress most jobs
          either=$([ "$be" = true ] || [ "$fe" = true ] && echo true || echo false)

          expect pr-title "$IS_PR"
          expect changes true
          for job in build postgres-test lint security; do expect "$job" "$(all "$runs" "$be")"; done
          expect frontend-test "$runs"
          expect frontend-lint "$(all "$runs" "$fe")"
          expect frontend-test-report "$(all "$runs" "$fe")"
          expect e2e "$fe"
          expect docker-build "$(all "$IS_PR" "$runs" "$either")"
          expect api-compat "$(all "$IS_PR" "$(not "$BREAKING_ALLOWED")" "$api")"
          exit "$fail"

name: PR Metadata

# A title edit or a breaking-changes-allowed label change alters the CI OK
# verdict but not the code under test (RECEIPTS-1135). Instead of re-testing
# the commit, this re-runs the CI OK job of the commit's existing CI run. That
# job reads the title and labels live and keeps the tested results it depends
# on. This workflow never reports CI OK itself, so it can neither hide a code
# failure nor pass code that was not tested.
on:
  pull_request:
    types: [edited, labeled, unlabeled]
    branches: ["main"]

permissions: {}

jobs:
  refresh:
    name: Refresh CI OK
    # Body edits and other labels do not affect CI OK.
    if: >-
      (github.event.action == 'edited' && github.event.changes.title != null) ||
      (github.event.action != 'edited' && github.event.label.name == 'breaking-changes-allowed')
    # One refresh per PR at a time. No cancel-in-progress: the newest queued
    # refresh always runs, and it reads the latest state.
    concurrency:
      group: pr-metadata-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write

    steps:
      - name: Re-run CI OK for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$REPO/actions/workflows/github-ci.yml/runs?event=pull_request&head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No CI run for $SHA yet. Its CI OK will read the current title and labels."
            exit 0
          fi
          echo "CI run: https://github.com/$REPO/actions/runs/$run_id"

          # A job can be re-run only once its whole run has completed. Until
          # CI OK starts it has read nothing, so there is nothing to refresh.
          while :; do
            run_status=$(gh api "repos/$REPO/actions/runs/$run_id" --jq .status)
            read -r job_id job_status < <(gh api "repos/$REPO/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
              --jq '([.jobs[] | select(.name == "CI OK")][0] // {}) | "\(.id // "-") \(.status // "-")"')
            if [ "$run_status" = completed ]; then
              if [ "$job_id" = - ]; then
                echo "::warning::The CI run finished without a CI OK job; nothing to re-run."
                exit 0
              fi
              gh api -X POST "repos/$REPO/actions/jobs/$job_id/rerun" >/dev/null
              echo "Re-ran CI OK (job $job_id)."
              exit 0
            fi
            case "$job_status" in
              -|queued|waiting|pending)
                echo "CI OK has not started. It will read the current title and labels."
                exit 0 ;;
            esac
            echo "CI OK is $job_status; waiting for the run to finish."
            sleep 15
          done

            format: int32
            default: 5
            minimum: 1
            maximum: 20
          description: Maximum number of results to return
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            format: double
            default: 0.3
            minimum: 0.0
            maximum: 1.0
          description: Minimum similarity score (0.0â€“1.0)
        - name: semantic
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to include semantic (embedding-based) similarity in ranking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarItemResponse"


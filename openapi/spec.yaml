            rejected. Every card of a source account must be listed, or none of them.
        ynabMappingWinnerAccountId:
          type:
            - string
            - "null"
          format: uuid
          description: >
            The account whose YNAB mapping should be retained when mappings conflict.
            Omit on first submit; if conflicts are returned, resubmit with this field.

    MergeCardsResponse:
      type: object
      required: [accountsRemoved, cardsMoved, transactionsRepointed]
      description: >
        What the merge actually changed. All three counts are zero when every selected
        card already belonged to the target account â€” the merge is idempotent, but the
        caller must be able to tell that apart from one that moved data.
      properties:
        accountsRemoved:
          type: integer
          format: int32
          description: Source accounts left without cards and deleted.
        cardsMoved:
          type: integer
          format: int32
          description: Cards whose account actually changed.
        transactionsRepointed:
          type: integer
          format: int32
          description: Transactions repointed to the target account, including soft-deleted ones.

    MergeCardsPreviewRequest:
      type: object
      required: [sourceCardIds]
      description: >
        Like MergeCardsRequest, but `targetAccountId` may be omitted to preview a merge
        into an account that does not exist yet. The merge dialog's "New account" mode
        needs that: it must know the selection is valid before creating the account,
        because a rejected merge would otherwise strand an empty one.
      properties:
        targetAccountId:
          type:
            - string
            - "null"
          format: uuid
          description: Omit to preview against a new, empty account.
        sourceCardIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        ynabMappingWinnerAccountId:
          type:
            - string
            - "null"
          format: uuid

    MergeCardsPreviewAccount:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    MergeCardsPreviewMapping:
      type: object
      required: [fromAccountId, fromAccountName, ynabAccountName]
      description: The YNAB mapping that would survive, and the account it currently sits on.
      properties:
        fromAccountId:
          type: string
          format: uuid
        fromAccountName:
          type: string
        ynabAccountName:
          type: string

    MergeCardsPreviewResponse:
      type: object
      required:
        [
          accountsToRemove,
          cardsToMove,
          transactionsToRepoint,
          trashedTransactionsToRepoint,
          ynabMappingsToMove,
        ]
      description: >
        What the merge would do, computed without writing. Every count is zero and
        `accountsToRemove` empty when the merge would change nothing. When `conflicts`
        is present the merge cannot run until a winner is nominated, and the rest of
        the preview is not yet meaningful.
      properties:
        accountsToRemove:
          type: array
          description: Accounts the merge would empty and then delete. Deletion is not reversible.
          items:
            $ref: "#/components/schemas/MergeCardsPreviewAccount"
        cardsToMove:
          type: integer
          format: int32
          description: Cards whose account would actually change.
        transactionsToRepoint:
          type: integer
          format: int32
          description: Live transactions that would be repointed to the target account.
        trashedTransactionsToRepoint:
          type: integer
          format: int32
          description: >
            Soft-deleted transactions that would be repointed too. Reported separately
            because they are invisible everywhere except the recycle bin, and a merge
            moves them just the same.
        ynabMappingsToMove:
          type: integer
          format: int32
          description: Number of destination-scoped YNAB mappings moved from source accounts.
        survivingYnabMapping:
          oneOf:
            - $ref: "#/components/schemas/MergeCardsPreviewMapping"
            - type: "null"
          description: Present only when exactly one mapping would move; use ynabMappingsToMove for the total.
        conflicts:
          type:
            - array
            - "null"
          description: Present when the sources carry differing YNAB mappings and no winner was given.
          items:
            $ref: "#/components/schemas/YnabMappingConflict"

    YnabMappingConflict:
      type: object
      required:
        [accountId, accountName, ynabBudgetId, ynabAccountId, ynabAccountName]
      properties:
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        ynabBudgetId:
          type: string
        ynabAccountId:
          type: string
        ynabAccountName:
          type: string


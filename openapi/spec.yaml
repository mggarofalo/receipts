          items: { $ref: "#/components/schemas/CategoryAssistanceCandidateRead" }

    SpendingByNormalizedDescriptionResponse:
      type: object
      required: [totalCount, grandTotal, items]
      properties:
        totalCount:
          type: integer
          format: int32
          description: Total number of normalized-description buckets matching the filter, across all pages.
        grandTotal:
          type: number
          format: double
          description: Sum of totalAmount across every bucket matching the filter, across all pages. Denominator for each item's share of total.
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpendingByNormalizedDescriptionItem"
        fromDate:
          type: ["string", "null"]
          format: date-time

              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/receipts/{id}/budget-choices:
    put:
      operationId: SetReceiptBudgetChoices
      tags: [Receipts]
      summary: Set a receipt's paid-from envelope and occasion
      description: Replaces both choices. A null envelope is automatic, which returns receipt-sourced items to their item-type default; an envelope applies to every item without a per-item override. A changed occasion replaces it on items that carried the previous one. Keeping an archived choice is allowed.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptBudgetChoicesRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: A newly chosen envelope or occasion is missing or archived
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found

  /api/receipts/complete:
    post:
      operationId: CreateCompleteReceipt
      tags: [Receipts]
      summary: Create a receipt with transactions, items, and adjustments atomically
      description: >
        Creates a receipt along with its transactions, items, and receipt-level
        adjustments in a single atomic operation. If any part fails, nothing is
        persisted. Adjustment amounts are signed: additions are positive and
        reductions are negative.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompleteReceiptRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteReceiptResponse"
        "400":
          description: Invalid receipt data or unbalanced totals
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "403":
          description: Normalization choice rejected; no partial receipt or catalog writes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "409":
          description: Receipt request, normalization choice, or classification conflict; no partial receipt, catalog, or classification writes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/receipts/batch:
    post:
      operationId: CreateReceipts
      tags: [Receipts]
      summary: Create receipts in batch
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:

  /api/search/purchases:
    get:
      operationId: SearchPurchases
      tags: [Search]
      summary: Search purchase history
      description: >
        Searches all active receipt items on active receipts using a trimmed,
        case-insensitive literal substring across description, item code, store,
        and active canonical description or its display label (also pending identities
        when includeUnreviewed is true). Rejected identities never provide labels or
        identity history; excluded purchase associations are hidden. Filters apply before
        counting and pagination. Returns individual purchases sorted by receipt date
        descending by default, with receipt ID and item ID ascending as stable ties. Prices retain
        their stored currencies and precision; no currency conversion or physical
        unit comparison is performed. Count and page are live reads and can
        change during concurrent edits.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: includeUnreviewed
          in: query
          schema:
            type: boolean
            default: false
          description: Expose active and pending provisional associations explicitly with their purchase review state; rejected identities and excluded associations remain hidden. Raw purchases always remain searchable.
        - name: normalizedDescriptionId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter identity history before pagination; verified assignments by default.
        - name: categoryView
          in: query
          description: Select recorded classification paths or the captured current taxonomy hierarchy.
          schema:
            type: string
            enum: [asClassified, currentHierarchy]
            default: asClassified
        - name: categoryId
          in: query
          description: Stable category ID; includes descendants in the selected view before count and pagination. Unresolved classifications are excluded.
          schema:
            type: string
            format: uuid
        - name: knowledgeCutoff
          in: query
          description: Inclusive UTC recorded-at cutoff for latest known assignment (Z suffix required); monetary facts remain current.
          schema:
            type: string
            format: date-time
        - name: capturedCurrentRevisionId
          in: query
          description: Immutable taxonomy revision to reuse with currentHierarchy across pages.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Literal search phrase, 2 to 200 characters after trimming. May be omitted or empty with normalizedDescriptionId or categoryId. When supplied, intersects the filters.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
        - name: sortBy
          in: query
          description: Sort column (date, description, location, unitPrice, quantity, or totalAmount).
          schema:
            type: string
            default: date
        - name: sortDirection
          in: query
          description: Sort direction (asc or desc).
          schema:
            type: string
            default: desc
        - name: location
          in: query
          description: Optional case-insensitive literal store substring, at most 200 characters after trimming.
          schema:
            type: string
            nullable: true
        - name: startDate
          in: query
          description: Inclusive earliest receipt date.
          schema:
            type: string
            format: date
            nullable: true
        - name: endDate
          in: query
          description: Inclusive latest receipt date, not earlier than startDate.
          schema:
            type: string
            format: date
            nullable: true
        - name: minUnitPrice
          in: query
          description: Inclusive minimum recorded unit price, non-negative. No currency conversion.
          schema:
            type: number
            format: double
            nullable: true
        - name: maxUnitPrice
          in: query
          description: Inclusive maximum recorded unit price, non-negative and not less than minUnitPrice.
          schema:
            type: number
            format: double
            nullable: true
      responses:
        "200":
          description: Matching purchases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseSearchResponse"
        "400":
          description: Invalid search phrase or pagination
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


  /api/receipts:
    get:
      operationId: GetAllReceipts
      tags: [Receipts]
      summary: Get all receipts
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDirection"
        - name: accountId
          in: query
          required: false
          description: Filter to receipts with at least one transaction on a card belonging to this account.
          schema:
            type: string
            format: uuid
        - name: cardId
          in: query
          required: false
          description: Filter to receipts with at least one transaction on this card.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case-insensitive substring filter applied to the receipt Location column. Whitespace-only values are ignored.
          schema:
            type: string
        - name: location
          in: query
          required: false
          description: >-
            Exact-match filter on the receipt Location column. Unlike `q`, which is a
            case-insensitive substring search, this is a literal byte-for-byte equality test:
            case-sensitive and not trimmed. It exists so a drill-down from the Spending by Location
            report returns exactly the rows that report's row counted, and that report groups on the
            raw Location value â€” so "Walmart" and "walmart" are distinct filters, as are "Target" and
            "Target ". Empty values are ignored. Combines with `q` as an AND.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptListResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

      operationId: SyncYnabMemos
      tags: [YNAB]
      summary: Sync YNAB memo for a receipt
      description: Matches local transactions to YNAB transactions and updates their memos with a receipt link.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncYnabMemosRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YnabMemoSyncResponse"
        "503":
          description: YNAB integration is not configured

  /api/ynab/sync-memos/bulk:
    post:
      operationId: SyncYnabMemosBulk
      tags: [YNAB]
      summary: Bulk sync YNAB memos
      description: Batch syncs YNAB memos for multiple receipts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncYnabMemosBulkRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YnabMemoSyncResponse"
        "503":
          description: YNAB integration is not configured

  /api/ynab/sync-memos/resolve:
    post:
      operationId: ResolveYnabMemoSync
      tags: [YNAB]
      summary: Resolve ambiguous YNAB memo sync
      description: Resolves an ambiguous match by linking a local transaction to a specific YNAB transaction.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveYnabMemoSyncRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YnabMemoSyncResultItem"
        "503":
          description: YNAB integration is not configured

  /api/ynab/sync-status/{transactionId}:
    get:
      operationId: GetYnabSyncStatus
      tags: [YNAB]
      summary: Get YNAB sync status for a transaction
      description: Returns the sync record for a given local transaction ID and sync type.
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: syncType
          in: query
          required: true
          schema:
            type: string
            enum: [memoUpdate, transactionPush]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YnabSyncRecordResponse"
        "404":
          description: No sync record found

  /api/ynab/push-transactions:
    post:
      operationId: PushYnabTransactions
      tags: [YNAB]
      summary: Push receipt transactions to YNAB
      description: >
        Creates split transactions in YNAB from a single receipt.
        Allocates tax and adjustments proportionally across item categories.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushYnabTransactionsRequest"
      responses:
        "200":
          description: Push completed (check result for per-transaction status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushYnabTransactionsResponse"
        "400":
          description: Validation failed (unmapped categories, currency mismatch, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushYnabTransactionsResponse"
        "503":
          description: YNAB integration is not configured

  /api/ynab/push-transactions/bulk:
    post:
      operationId: BulkPushYnabTransactions
      tags: [YNAB]
      summary: Push transactions for multiple receipts to YNAB
      description: >
        Creates split transactions in YNAB for each receipt in the batch.
        Each receipt is processed independently; failures don't block other receipts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPushYnabTransactionsRequest"
      responses:
        "200":
          description: Bulk push completed (check per-receipt results)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPushYnabTransactionsResponse"
        "503":
          description: YNAB integration is not configured

  /api/ynab/receipts/{receiptId}/split-comparison:
    get:
      operationId: GetReceiptYnabSplitComparison
      tags: [YNAB]
      summary: Get expected vs actual YNAB category split for a receipt
      description: >
        Returns the expected YNAB category split computed locally alongside the
        actual state stored in YNAB for any already-pushed transactions. Used by
        the receipt detail page to validate and preview splits. The default
        asClassified view uses recorded assignment ancestry; currentHierarchy
        previews mapping against one captured current taxonomy revision.
      security:
        - BearerAuth: []
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryView
          in: query
          description: Classification ancestry used for the expected split. Defaults to asClassified.
          schema:
            type: string
            enum: [asClassified, currentHierarchy]
            default: asClassified
      responses:
        "200":
          description: Split comparison for the receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptYnabSplitComparisonResponse"
        "400":
          description: Invalid category view
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: YNAB integration is not configured

  /api/ynab/rate-limit-status:
    get:
      operationId: GetYnabRateLimitStatus
      tags: [YNAB]
      summary: Get YNAB API rate limit status
      description: >
        Returns the current YNAB API rate limit status including remaining
        requests, total quota, and window reset time. YNAB enforces 200
        requests per hour with no response headers, so this is tracked
        proactively on the client side.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rate limit status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YnabRateLimitStatusResponse"
  /api/ynab/receipt-sync-statuses:
    get:
      operationId: GetReceiptYnabSyncStatuses
      tags: [YNAB]
      summary: Get YNAB sync statuses for receipts
      description: >
        Returns the aggregate YNAB sync status for each receipt.
        Joins through transactions to sync records and returns the worst-case status per receipt.
      security:
        - BearerAuth: []
      parameters:
        - name: receiptIds
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptYnabSyncStatusListResponse"


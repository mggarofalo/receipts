          required: false
          schema:
            type: string
            format: date
          description: Start date (ISO date string). Defaults to the earliest supported date.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (ISO date string). Defaults to today.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of categories to return (top N).
        - name: categoryView
          in: query
          required: false
          description: Classification view. Defaults to asClassified.
          schema:
            type: string
            enum: [asClassified, currentHierarchy]
            default: asClassified
        - name: rollup
          in: query
          required: false
          description: Bucket level. Defaults to assignedCategory.
          schema:
            type: string
            enum: [assignedCategory, root]
            default: assignedCategory
        - name: categoryId
          in: query
          required: false
          description: Include this category and descendants in the selected view.
          schema:
            type: string
            format: uuid
        - name: knowledgeCutoff
          in: query
          required: false
          description: Inclusive UTC classification knowledge cutoff with Z suffix. Financial facts remain current.
          schema:
            type: string
            format: date-time
        - name: capturedCurrentRevisionId
          in: query
          required: false
          description: Reuse an existing immutable revision; requires currentHierarchy.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendingByCategoryResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


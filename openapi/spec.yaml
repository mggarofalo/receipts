components:
  schemas:
    RestructureApplicationPage:
      required:
        - items
        - nextOffset
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestructureApplicationSummary'
        nextOffset:
          type:
            - 'null'
            - integer
          format: int32
    RestructureApplicationSummary:
      required:
        - id
        - planId
        - reason
        - appliedAt
        - undoneAt
        - state
        - progress
        - report
      type: object
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        undoneAt:
          type:
            - 'null'
            - string
          format: date-time
        state:
          $ref: '#/components/schemas/HistoricalOperationState'
        progress:
          $ref: '#/components/schemas/HistoricalProgress'
        report:
          $ref: '#/components/schemas/RestructureReport'
    RestructureBeginBody:
      required:
        - applicationId
        - plan
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/RestructurePlan'
    RestructureBudgetReport:
      required:
        - itemsChangingEnvelope
        - itemsChangingYnabCategory
      type: object
      properties:
        itemsChangingEnvelope:
          type: integer
          format: int32
        itemsChangingYnabCategory:
          type: integer
          format: int32
    RestructureChunkBody:
      required:
        - limit
      type: object
      properties:
        limit:
          type: integer
          format: int32
    RestructureDefaultsReport:
      required:
        - kept
        - moved
        - removed
        - set
      type: object
      properties:
        kept:
          type: integer
          format: int32
        moved:
          type: integer
          format: int32
        removed:
          type: integer
          format: int32
        set:
          type: integer
          format: int32
    RestructureEnvelopeDefault:
      required:
        - categoryId
        - envelope
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        envelope:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RestructureEnvelopeRef'
    RestructureEnvelopeMerge:
      required:
        - source
        - target
      type: object
      properties:
        source:
          $ref: '#/components/schemas/RestructureEnvelopeRef'
        target:
          $ref: '#/components/schemas/RestructureEnvelopeRef'
    RestructureEnvelopeRef:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        ynabCategoryId:
          type:
            - 'null'
            - string
    RestructureItemFilter:
      enum:
        - all
        - conflicted
        - cleared
      default: all
    RestructureItemPage:
      required:
        - items
        - nextOffset
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestructureItemRow'
        nextOffset:
          type:
            - 'null'
            - integer
          format: int32
    RestructureItemReassignment:
      required:
        - itemId
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        targetCategoryId:
          type:
            - 'null'
            - string
          format: uuid
        clear:
          type: boolean
          default: false
        occasion:
          type:
            - 'null'
            - string
        rule:
          type: string
          default: ''
        evidence: {}
    RestructureItemReport:
      required:
        - considered
        - reassigned
        - cleared
        - unchanged
        - conflicts
        - missingFromDeployment
        - byRule
      type: object
      properties:
        considered:
          type: integer
          format: int32
        reassigned:
          type: integer
          format: int32
        cleared:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
        conflicts:
          type: integer
          format: int32
        missingFromDeployment:
          type: integer
          format: int32
        byRule:
          type: object
          additionalProperties:
            type: integer
            format: int32
    RestructureItemRow:
      required:
        - itemId
        - receiptId
        - store
        - description
        - fromPath
        - toPath
        - rule
        - state
        - reason
        - undoState
        - undoReason
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        store:
          type: string
        description:
          type: string
        fromPath:
          type: string
        toPath:
          type: string
        rule:
          type: string
        state:
          $ref: '#/components/schemas/HistoricalItemState'
        reason:
          type:
            - 'null'
            - string
        undoState:
          $ref: '#/components/schemas/HistoricalItemState'
        undoReason:
          type:
            - 'null'
            - string
    RestructureMappingsReport:
      required:
        - reapproved
        - repointed
        - revoked
        - leftStale
      type: object
      properties:
        reapproved:
          type: integer
          format: int32
        repointed:
          type: integer
          format: int32
        revoked:
          type: integer
          format: int32
        leftStale:
          type: integer
          format: int32
    RestructureMergeReport:
      required:
        - source
        - target
        - items
        - receipts
        - defaults
        - itemsChangingYnabCategory
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        items:
          type: integer
          format: int32
        receipts:
          type: integer
          format: int32
        defaults:
          type: integer
          format: int32
        itemsChangingYnabCategory:
          type: integer
          format: int32
    RestructureNodeMapping:
      required:
        - categoryId
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        targetCategoryId:
          type:
            - 'null'
            - string
          format: uuid
        clear:
          type: boolean
          default: false
        occasion:
          type:
            - 'null'
            - string
    RestructureOccasionReport:
      required:
        - name
        - created
        - items
      type: object
      properties:
        name:
          type: string
        created:
          type: boolean
        items:
          type: integer
          format: int32
    RestructurePlan:
      required:
        - format
        - version
        - planId
        - reason
        - baseTaxonomyRevisionId
        - snapshotAt
        - taxonomyChanges
        - nodeMappings
      type: object
      properties:
        format:
          type: string
        version:
          type: integer
          format: int32
        planId:
          type: string
          format: uuid
        reason:
          type: string
        baseTaxonomyRevisionId:
          type: string
          format: uuid
        snapshotAt:
          type: string
          format: date-time
        taxonomyChanges:
          type: array
          items:
            $ref: '#/components/schemas/RestructureCategoryChange'
        nodeMappings:
          type: array
          items:
            $ref: '#/components/schemas/RestructureNodeMapping'
        items:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/RestructureItemReassignment'
        occasions:
          type:
            - 'null'
            - array
          items:
            type: string
        envelopeDefaults:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/RestructureEnvelopeDefault'

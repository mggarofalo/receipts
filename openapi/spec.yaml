    # â”€â”€ Normalized Descriptions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    EmbeddingCoverageResponse:
      type: object
      required:
        [
          fingerprint,
          canonicalReady,
          canonicalTotal,
          canonicalPending,
          itemReady,
          itemTotal,
          itemPending,
          isComplete,
        ]
      properties:
        fingerprint:
          type: string
          description: Full model, tokenizer, pooling, and normalization fingerprint admitted by semantic readers.
        canonicalReady:
          type: integer
          format: int32
        canonicalTotal:
          type: integer
          format: int32
        canonicalPending:
          type: integer
          format: int32
        itemReady:
          type: integer
          format: int32
        itemTotal:
          type: integer
          format: int32
        itemPending:
          type: integer
          format: int32
        isComplete:
          type: boolean
          description: True only when every eligible canonical description and source item has a current vector.

    NormalizedDescriptionStatus:
      type: string
      enum: [active, pendingReview, rejected]
      description: |
        `active` rows are confidently-classified and re-used as-is by the resolver.
        `pendingReview` rows are flagged for admin review before being promoted.
        `rejected` rows are tombstones: a reviewer judged the matched text not worth a canonical
        entry, so the row survives only to stop the resolver recreating it. Rejected rows are
        excluded from ANN candidate search, carry no linked receipt items, and never appear as a
        bucket in the spending report â€” their items report as "(Not Normalized)".

    NormalizedDescriptionResponse:
      type: object
      required:
        [
          id,
          canonicalName,
          displayName,
          status,
          createdAt,
          linkedItemCount,
          sampleRawDescriptions,
        ]
      properties:
        id:
          type: string
          format: uuid
        canonicalName:
          type: string
          description: |
            The observed receipt text this row matches on. Never edited â€” the embedding is
            anchored to it. Use `displayName` when showing this row to a user.
        displayLabel:
          type: ["string", "null"]
          maxLength: 200
          description: |
            Human-chosen name for this row, or null when nobody has renamed it. Purely cosmetic:
            it never participates in matching, so it can never misroute a future resolution.
        displayName:
          type: string
          description: |
            What to show a user: `displayLabel` when set, otherwise `canonicalName`. Unique
            across rows, case-insensitively.
        status:
          $ref: "#/components/schemas/NormalizedDescriptionStatus"
        createdAt:
          type: string
          format: date-time
        linkedItemCount:
          type: integer
          format: int32
          description: |
            Number of live (non-deleted) receipt items currently pointing at this row. Tells a
            reviewer how much data an Approve/Merge/Split decision actually moves.
        lastSeen:
          type: ["string", "null"]
          format: date-time
          description: |
            Latest receipt date among the live items linked to this row, at midnight UTC â€” a
            receipt has a date, not a time. Null when nothing is linked, which is a different
            statement from "last seen a long time ago".

            Added in RECEIPTS-880. `createdAt` alone cannot distinguish a two-year-old entry
            still matching this week's receipts from one nothing has matched since, and that is
            the difference between a live registry entry and dead weight. Same meaning as
            `SpendingByNormalizedDescriptionItem.lastSeen`.
        sampleRawDescriptions:
          type: array
          items:
            type: string
          description: |
            Up to three distinct raw receipt-item descriptions linked to this row, so a reviewer
            can see the text the entry actually covers. Empty when no items are linked yet.
        linkedTemplateName:
          type: ["string", "null"]
          description: |
            Name of an item template that declares this row, or null when no template does.
            Evidence rather than decoration: a template is a user saying "this item exists and
            is called X", so a pending row carrying one has already been vouched for by hand and
            is almost always an Approve (RECEIPTS-930).

            When several templates point here â€” the ordinary result of merging two
            template-backed entries â€” this is the alphabetically first, and `linkedTemplateCount`
            says how many there are. Soft-deleted (hidden) templates are excluded: a template the
            user has put in the recycle bin is not evidence of anything.
        linkedTemplateId:
          type: ["string", "null"]
          format: uuid
          description: |
            ID of the template named by `linkedTemplateName`, so a client can link straight to
            it. Null exactly when that name is null.
        linkedTemplateCount:
          type: integer
          format: int32
          description: |
            How many live item templates declare this row. Zero for the machine-derived majority.
            Greater than one is legitimate and reachable: merging two template-backed entries
            leaves both templates pointing at the survivor.

            Absent on responses from before RECEIPTS-930; treat a missing value as 0.
        nearestNeighbourName:
          type: ["string", "null"]
          description: |
            Display name of the canonical row this entry most nearly matched when the resolver
            flagged it for review. Null when no near-miss was recorded â€” the row was auto-accepted,
            created outright, predates the field, or its neighbour has since been merged away.
            Clients must render that absence as "no comparison recorded", never as a zero score.
        nearestNeighbourSimilarity:
          type: ["number", "null"]
          format: double
          description: |
            Cosine similarity against `nearestNeighbourName` at the moment the entry was flagged,
            in [0, 1]. Null carries the same "no comparison recorded" meaning as the name above and
            is distinct from a genuine score of 0.

    NormalizedDescriptionListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NormalizedDescriptionResponse"
        totalCount:
          type: integer
          format: int32
          description: |
            Total number of rows matching the status and search filters, across all pages.
            Since RECEIPTS-879 this is the count to page against â€” it is no longer the length
            of `items`, which is capped by `limit`.
        offset:
          type: integer
          format: int32
          description: Echoed from the request. Absent on responses from before RECEIPTS-879.
        limit:
          type: integer
          format: int32
          description: Echoed from the request. Absent on responses from before RECEIPTS-879.

    RenameNormalizedDescriptionRequest:
      type: object
      properties:
        displayLabel:
          type: ["string", "null"]
          maxLength: 200
          description: |
            New display label. Null â€” or an omitted property â€” clears it, so the row falls back
            to showing its matched text. The two are equivalent because this is the only field
            the endpoint has: there is no other change a caller could be asking for, so an
            absent label cannot mean "leave it alone".

            A whitespace-only string is a 400, not a clear. An empty text box is far more often
            a mistake than an intent, and the two deserve different answers.

    MergeNormalizedDescriptionRequest:
      type: object
      required: [discardId]
      properties:
        discardId:
          type: string
          format: uuid
          description: ID of the NormalizedDescription to merge away. All ReceiptItems pointing at this row will be re-linked to the kept row.

    SplitNormalizedDescriptionRequest:
      type: object
      required: [receiptItemIds, canonicalName]
      properties:
        receiptItemIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: |
            IDs of the ReceiptItems to detach into one new canonical entry. All-or-nothing: if
            any id does not exist the whole request is rejected with 404 and nothing is written,
            so a split never leaves a half-corrected group behind.
        canonicalName:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Name for the new entry. Supplied by the caller rather than derived from the
            selection: a multi-item split routinely spans heterogeneous raw text ("MILK 2%",
            "milk gal", "WHOLE MILK") where no automatic rule produces a name anyone would want.

            If an entry with this name already exists the items are re-linked to it instead of a
            new row being created; the response reports the row they landed on either way.

    UpdateNormalizedDescriptionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/NormalizedDescriptionStatus"

    LinkItemTemplateRequest:
      type: object
      required: [itemTemplateId]
      properties:
        itemTemplateId:
          type: string
          format: uuid
          description: |
            The template whose item this row is. Must be a live template â€” a soft-deleted one is
            a 404, since linking to something sitting in the recycle bin would produce a link
            that vanishes the moment it is purged.

    MergeNormalizedDescriptionsResponse:
      type: object
      required: [itemsRelinkedCount]
      properties:
        itemsRelinkedCount:
          type: integer
          format: int32
          description: Number of ReceiptItems that were re-linked from the discarded row to the kept row. Zero when either id was missing or the two ids were identical.

    LinkItemTemplateResponse:
      type: object
      required: [description, itemsRelinkedCount, merged]
      properties:
        description:
          $ref: "#/components/schemas/NormalizedDescriptionResponse"
        itemsRelinkedCount:
          type: integer
          format: int32
          description: |
            Live receipt items moved off the requested row and onto the template's entry. Zero
            when `merged` is false, and legitimately zero when it is true and the row held
            nothing.
        merged:
          type: boolean
          description: |
            False when the requested row already *was* the template's entry, so all that happened
            was the template's foreign key being set â€” nothing moved and nothing was deleted.

            True when the two were different rows and the requested row was consolidated into the
            template's entry and deleted. Clients should treat this as the destructive case and
            say so before asking for it.

    RequeuePendingRequest:
      type: object
      required: [expectedFingerprint]
      properties:
        expectedFingerprint:
          type: string
          minLength: 1
          description: The `pendingFingerprint` the caller last previewed. The requeue is rejected with 409 unless the live pending set is identical, so a stale client cannot delete a row its operator never reviewed. A count would not be sufficient â€” one row being approved away while another becomes pending leaves the count unchanged but the set different.

    RequeuePendingPreviewResponse:
      type: object
      required:
        [
          pendingDescriptionCount,
          pendingFingerprint,
          linkedItemCount,
          estimatedResolverCycles,
          estimatedCatchUpSeconds,
        ]
      properties:
        pendingDescriptionCount:
          type: integer
          format: int32
          description: Number of PendingReview rows that would be deleted.
        pendingFingerprint:
          type: string
          description: Opaque digest identifying the exact set of PendingReview rows this preview describes. Echo it back on the requeue request; the server rejects the call with 409 if the set has changed in the meantime. Stable across processes and independent of row ordering.
        linkedItemCount:
          type: integer
          format: int32
          description: Number of live (non-trashed) ReceiptItems that would be unlinked. Trashed items pointing at a pending row are unlinked too, for integrity, but are deliberately not counted here â€” the same convention the merge endpoint uses.
        estimatedResolverCycles:
          type: integer
          format: int32
          description: Legacy compatibility field, always zero. Pending cleanup requires reviewed normalization; no automatic similarity rematching is scheduled.
        estimatedCatchUpSeconds:
          type: integer
          format: int32
          description: Legacy compatibility field, always zero. No automatic similarity rematching completion time is estimated.

    RequeuePendingResponse:
      type: object
      required:
        [deletedDescriptionCount, unlinkedItemCount]
      properties:
        deletedDescriptionCount:
          type: integer
          format: int32
          description: Number of PendingReview rows deleted.
        unlinkedItemCount:
          type: integer
          format: int32
          description: Number of live ReceiptItems whose NormalizedDescriptionId was nulled.

    # â”€â”€ Receipt â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    CreateReceiptRequest:
      type: object
      required: [location, date, taxAmount]
      properties:
        paidFromEnvelopeId:
          type: [string, "null"]
          format: uuid
          description: Optional "paid from" envelope applied to every item that has no per-item override. Omitted or null keeps the stored choice on update.
        occasionId:
          type: [string, "null"]
          format: uuid
          description: Optional occasion tag applied to items without their own. Omitted or null keeps the stored choice on update.
        location:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
        taxAmount:
          type: number
          format: double

    UpdateReceiptRequest:
      type: object
      required: [id, location, date, taxAmount]
      properties:
        paidFromEnvelopeId:
          type: [string, "null"]
          format: uuid
          description: Optional "paid from" envelope applied to every item that has no per-item override. Omitted or null keeps the stored choice on update.
        occasionId:
          type: [string, "null"]
          format: uuid
          description: Optional occasion tag applied to items without their own. Omitted or null keeps the stored choice on update.

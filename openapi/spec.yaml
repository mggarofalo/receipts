    ProblemDetails:
      type: object
      description: >
        RFC 9457 problem document. Every 4xx this API raises with a reason answers in
        this shape; the human-readable reason is always in `detail`. Some responses add
        machine-readable members alongside these (for example `transactionCount` on a
        409 from a delete that is blocked by references) â€” RFC 9457 permits such
        extension members, and they appear at the top level of the object.
      properties:
        type:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
        status:
          type:
            - integer
            - "null"
          format: int32
        detail:
          type:
            - string
            - "null"
        instance:
          type:
            - string
            - "null"


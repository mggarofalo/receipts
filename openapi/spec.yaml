          type: array
          items:
            $ref: "#/components/schemas/AcceptedDuplicateGroup"

    AcceptedDuplicateGroup:
      type: object
      required: [receipts, memberReceiptIds, acceptedAt]
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateReceipt"
          description: The members that still exist, for display. Members whose receipt was deleted are omitted.
        memberReceiptIds:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Every member of the group, including any omitted from receipts because the receipt was
            deleted. Undo must submit this list rather than the displayed receipts, or the pairs
            touching a deleted member are left stored with no way to reach them again.
        acceptedAt:
          type: string
          format: date-time
          description: When the most recent pair in this group was accepted.

    AcceptDuplicateGroupRequest:
      type: object
      required: [receiptIds]
      properties:
        receiptIds:
          type: array
          minItems: 2
          maxItems: 100
          items:
            type: string
            format: uuid
          description: The receipts in the group. At least two distinct IDs, and at most 100 â€” accepting expands to one stored row per pair, so the list is bounded the same way bulk YNAB pushes are.

    UnacceptDuplicateGroupRequest:
      type: object
      required: [receiptIds]
      properties:
        receiptIds:
          type: array
          minItems: 2
          items:
            type: string
            format: uuid
          description: >
            Every receipt whose mutual acceptances should be removed. At least two distinct IDs.
            Deliberately has no upper bound, unlike AcceptDuplicateGroupRequest: accepting stores one
            row per pair and is quadratic, whereas un-accepting loads and soft-deletes existing matching
            pairs without creating rows. Its cost follows existing pairs, which may also be quadratic. An accepted group can exceed 100 members without any
            single accept call doing so, because groups are connected components that merge when an
            acceptance bridges two of them â€” capping this would make such a group impossible to undo.

    AcceptDuplicateGroupResponse:
      type: object
      required: [acceptedPairCount]
      properties:
        acceptedPairCount:
          type: integer
          format: int32
          description: Number of receipt pairs newly recorded as not-a-duplicate. Zero when the group was already fully accepted.

    UnacceptDuplicateGroupResponse:
      type: object
      required: [removedPairCount]
      properties:
        removedPairCount:
          type: integer
          format: int32
          description: Number of accepted receipt pairs removed.


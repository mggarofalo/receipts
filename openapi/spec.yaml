          type: string
          format: uuid
        revision:
          type: string
          format: uuid
        name:
          type: string

    ReceiptNormalizationPreviewResponse:
      type: object
      required:
        [
          sourceFingerprint,
          excluded,
          candidates,
          total,
          offset,
          limit,
          sourceAmbiguous,
        ]
      properties:
        sourceFingerprint:
          type: string
        sourceAmbiguous:
          type: boolean
          description: This exact source has multiple recorded product identities; confirm individual purchases instead of remembering one unconditional mapping.
        mappingId:
          type: [string, "null"]
          format: uuid
        mappingRevision:
          type: [string, "null"]
          format: uuid
        targetId:
          type: [string, "null"]
          format: uuid
        targetRevision:
          type: [string, "null"]
          format: uuid
        targetName:
          type: [string, "null"]
        excluded:
          type: boolean
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptNormalizationCandidate"
        total:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32

    NormalizationReviewState:
      type: string
      enum: [needsReview, verified, excluded]

    ReceiptNormalizationIntentKind:
      type: string
      enum: [knownSource, confirmExisting, confirmNew, exclude, defer]

    ReceiptNormalizationIntent:
      type: object
      required: [kind, clientRowId, sourceFingerprint]
      properties:
        kind:
          $ref: "#/components/schemas/ReceiptNormalizationIntentKind"
        clientRowId:
          type: string
          format: uuid
        sourceFingerprint:
          type: string
          minLength: 64
          maxLength: 64
        targetId:
          type: [string, "null"]
          format: uuid
        expectedTargetRevision:
          type: [string, "null"]
          format: uuid
        expectedMappingRevision:
          type: [string, "null"]
          format: uuid
          description: Required for knownSource. Echo the previewed mapping revision so a changed or revoked mapping rejects the choice.
        expectedItemRevision:
          type: [string, "null"]
          format: uuid
        newName:
          type: [string, "null"]
          maxLength: 200
        rememberSource:
          type: boolean
          default: false
        reason:
          type: [string, "null"]
          maxLength: 500
      description: A source-bound choice for one draft row. Existing identity selection requires its revision; editing requires the current item revision. Exclusion requires a reason. Remembering a source never rewrites historical purchases.

    CreateReceiptItemRequest:
      type: object
      required: [description, quantity, unitPrice, category]
      properties:
        envelopeId:
          type: [string, "null"]
          format: uuid
          description: Optional per-item envelope override. Omitted or null derives the envelope (receipt paid-from, else the item type's default) on create and keeps the recorded envelope on update.
        occasionId:
          type: [string, "null"]
          format: uuid
          description: Optional occasion tag. Omitted or null takes the receipt's occasion on create and keeps the stored tag on update.
        classification:
          oneOf:
            - $ref: "#/components/schemas/ClassificationRequest"
            - type: "null"
          description: Optional explicit manual assignment, atomic with receipt facts. Requires a nonempty clientRequestId query parameter for atomic retries. Omission preserves classification; categoryId null explicitly clears. Legacy labels must agree with the pinned path.
        normalizationIntent:
          oneOf:
            - $ref: "#/components/schemas/ReceiptNormalizationIntent"
            - type: "null"
          description: Omitted means use a current approved scoped mapping or retain NeedsReview; no automatic inference is approved.
        receiptItemCode:
          type: ["string", "null"]
        description:
          type: string
        quantity:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        itemTemplateId:
          type: ["string", "null"]
          format: uuid
          description: Optional provenance hint. A legacy template link does not verify the purchase; explicit source-bound selection or an approved scoped mapping is required.

    UpdateReceiptItemRequest:
      type: object
      required: [id, description, quantity, unitPrice, category]
      properties:
        envelopeId:
          type: [string, "null"]
          format: uuid
          description: Optional per-item envelope override. Omitted or null derives the envelope (receipt paid-from, else the item type's default) on create and keeps the recorded envelope on update.
        occasionId:
          type: [string, "null"]
          format: uuid
          description: Optional occasion tag. Omitted or null takes the receipt's occasion on create and keeps the stored tag on update.
        classification:
          oneOf:
            - $ref: "#/components/schemas/ClassificationRequest"
            - type: "null"
          description: Optional explicit manual assignment, atomic with receipt facts. Requires a nonempty clientRequestId query parameter for atomic retries. Omission preserves classification; categoryId null explicitly clears. Legacy labels must agree with the pinned path.
        normalizationIntent:
          oneOf:
            - $ref: "#/components/schemas/ReceiptNormalizationIntent"
            - type: "null"
          description: Omitted means use a current approved scoped mapping or retain NeedsReview; no automatic inference is approved.
        id:
          type: string
          format: uuid
        receiptItemCode:
          type: ["string", "null"]
        description:
          type: string
        quantity:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
        category:
          type: string
        subcategory:
          type: ["string", "null"]

    CurrentClassificationResponse:
      type: object
      description: Current assignment pinned to its recorded taxonomy revision.
      required: [assignmentId, taxonomyRevisionId, recordedPath]
      properties:
        assignmentId: { type: string, format: uuid }
        categoryId: { type: [string, "null"], format: uuid }
        taxonomyRevisionId: { type: string, format: uuid }
        recordedPath:
          type: array
          description: Root-to-leaf path in the recorded revision, unaffected by later renames, moves, or archives. Empty for unclassified assignments.
          items: { $ref: "#/components/schemas/TaxonomyNodeResponse" }

    ReceiptItemResponse:
      type: object
      required: [id, receiptId, description, quantity, unitPrice, category, envelopeSource]
      properties:
        envelopeId:
          type: [string, "null"]
          format: uuid
          description: Envelope recorded when the item was saved. Null is unresolved and cannot be pushed to YNAB.
        envelopeSource:
          $ref: "#/components/schemas/EnvelopeSource"
        occasionId:
          type: [string, "null"]
          format: uuid
        currentClassification:
          description: Null when no assignment exists; an explicit unclassified assignment has a null categoryId and an empty recordedPath. Legacy category and subcategory strings are retained independently.
          oneOf:
            - $ref: "#/components/schemas/CurrentClassificationResponse"
            - type: "null"
        normalizationRevision:
          type: string
          format: uuid
        normalizationReviewState:
          $ref: "#/components/schemas/NormalizationReviewState"
        normalizationReviewReason:
          type: [string, "null"]
        normalizationExclusionReason:
          type: [string, "null"]
        normalizationReviewDecisionId:
          type: [string, "null"]
          format: uuid
        id:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        receiptItemCode:
          type: ["string", "null"]
        description:
          type: string
        quantity:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
        category:
          type: string
          description: Legacy label kept only so an edit can send it back unchanged. Display currentClassification instead.
        subcategory:
          type: ["string", "null"]
          description: Legacy label kept only so an edit can send it back unchanged. Display currentClassification instead.
        normalizedDescriptionId:
          type: ["string", "null"]
          format: uuid
          description: "Provisional or reviewed canonical identity. Verification is expressed separately by normalizationReviewState."
        normalizedDescriptionName:
          type: ["string", "null"]
          description: "Display label of a live active or pending identity. Provisional unless normalizationReviewState is verified; rejected and excluded associations are hidden."


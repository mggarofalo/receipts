  # Normalized Descriptions (admin-only)
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /api/normalized-descriptions/embedding-coverage:
    get:
      operationId: GetNormalizedDescriptionEmbeddingCoverage
      tags: [NormalizedDescriptions]
      summary: Get semantic-vector rebuild coverage
      description: |
        Reports how many searchable canonical descriptions and source items carry vectors in
        the current model/tokenizer/pooling embedding space. The background worker rebuilds
        pending rows in bounded batches. Exact canonical-name matching remains available while
        coverage is incomplete; ANN and hybrid search ignore obsolete fingerprints. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingCoverageResponse"

  /api/normalized-descriptions/requeue-pending/preview:
    get:
      operationId: PreviewRequeuePendingNormalizedDescriptions
      tags: [NormalizedDescriptions]
      summary: Preview what a requeue of pending descriptions would destroy
      description: |
        Reports how many `PendingReview` rows would be deleted and how many live
        ReceiptItems would be unlinked. Nothing rebuilds
        the deleted rows automatically; the unlinked items wait for review in Catalog.

        Read-only â€” nothing is modified. Also serves as the post-run
        verification: after a successful requeue every count reads zero.
        Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeuePendingPreviewResponse"

  /api/normalized-descriptions/requeue-pending:
    post:
      operationId: RequeuePendingNormalizedDescriptions
      tags: [NormalizedDescriptions]
      summary: Delete every pending-review description and return its items to review
      description: |
        Deletes every `PendingReview` NormalizedDescription and, in the same
        transaction, nulls `NormalizedDescriptionId` on every ReceiptItem that
        pointed at one. Those items become unresolved. No similarity matcher re-links them:
        automatic resolution applies only exact, reviewed source mappings, so the
        items wait for review in Catalog.

        Destructive: any review judgement already applied to a pending row is
        discarded, and its receipt items stay unnormalized until someone reviews
        them. `Active` rows are never touched.

        `expectedFingerprint` must equal the `pendingFingerprint` the caller last
        previewed; a mismatch returns 409 rather than acting on stale information. Re-runnable
        â€” a second call with no pending rows deletes nothing. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequeuePendingRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequeuePendingResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The pending-review count changed since the caller previewed it. Nothing was deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/normalized-descriptions:
    get:
      operationId: GetAllNormalizedDescriptions
      tags: [NormalizedDescriptions]
      summary: List normalized descriptions
      description: |
        Returns one page of canonical normalized-description rows, optionally filtered by
        status and search term. Admin-only.

        Paginated since RECEIPTS-879. The row count is bounded by the number of unique
        receipt-item descriptions ever seen, which grocery receipts push into the thousands â€”
        the previous unpaginated behaviour made the registry load every row and filter in the
        browser. Callers that omit `offset`/`limit` now receive the first 50 rows rather than
        everything; read `totalCount` to page.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [Active, PendingReview, Rejected]
          description: |
            Optional status filter. Repeat the parameter to match any of several statuses
            (`?status=Active&status=PendingReview`); a comma-separated single value is accepted
            too. When absent, returns rows of every status. Matching is case-insensitive.

            Repeatable since RECEIPTS-878: the merge dialog needs every legitimate merge target,
            which is Active *and* PendingReview but never Rejected â€” a tombstone must not be
            resurrected by having items merged into it. A single-valued filter forced the client
            to choose one, so two near-duplicate pending entries from the same resolver batch
            could not be merged with each other. `?status=Active` still behaves exactly as before.
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive substring filter matched against both the display name and the
            matched text, so an entry is findable by what it is called now or by the receipt
            text it still resolves on. Whitespace-only values are ignored.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedDescriptionListResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/normalized-descriptions/{id}:
    get:
      operationId: GetNormalizedDescriptionById
      tags: [NormalizedDescriptions]
      summary: Get a normalized description by ID
      description: Returns a single canonical normalized-description row by GUID. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedDescriptionResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found

  /api/normalized-descriptions/{id}/merge:
    post:
      operationId: MergeNormalizedDescriptions
      tags: [NormalizedDescriptions]
      summary: Merge two normalized descriptions
      description: |
        Re-links every ReceiptItem currently pointing at `discardId` to the
        canonical row identified by the path `{id}` ("keep"), then deletes the
        discarded row. Returns the count of re-linked items, which is
        legitimately zero when the discarded row had no live items. Returns 404
        if either id does not exist. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the canonical row to keep (all items from `discardId` move here).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeNormalizedDescriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeNormalizedDescriptionsResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found â€” the kept or the discarded id does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/normalized-descriptions/{id}/split:
    post:
      operationId: SplitNormalizedDescription
      tags: [NormalizedDescriptions]
      summary: Detach a receipt item from its normalized description
      description: |
        Creates a new canonical row for the supplied ReceiptItem's raw description
        and re-points the item at it. Used to unpick bad auto-merges. The path
        `{id}` is the current NormalizedDescription the item is being split away
        from; the body identifies the specific ReceiptItem to isolate. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the NormalizedDescription the item is being split away from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitNormalizedDescriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedDescriptionResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found

        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/normalized-descriptions/{id}/link-template:
    post:
      operationId: LinkItemTemplateToNormalizedDescription
      tags: [NormalizedDescriptions]
      summary: Record that this row is an existing item template's item
      description: |
        For a reviewer who recognises a resolver-derived row as something they already curated a
        template for (RECEIPTS-930).

        The template's entry is the one whose canonical name equals the template's name â€” that is
        the invariant `ItemTemplateService` re-establishes on every create and update. So this
        endpoint resolves that entry (creating it if the template has never been linked), points
        the template's foreign key at it, and then **consolidates the row at `{id}` into it**:
        the row's receipt items are re-linked and the row is deleted, exactly as
        `POST {id}/merge` would.

        It does not simply point the template's foreign key at `{id}`, for two reasons. The link
        would not survive the template's next edit, which re-resolves it from the template's
        name. And it would not move the receipt items already sitting on `{id}`, so the two would
        go on reporting as separate buckets â€” which is the whole thing the caller is trying to
        fix.

        When `{id}` already *is* the template's entry, nothing is merged and nothing is deleted;
        only the foreign key is set. `merged` in the response says which of the two happened.

        Rejected rows cannot be linked: consolidating a tombstone away would delete the record of
        a reviewer's decision and let the resolver recreate the text. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The row being recognised. Deleted when it is not already the template's entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkItemTemplateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkItemTemplateResponse"
        "400":
          description: Bad Request â€” an empty id, or the row is a rejected tombstone
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found â€” the row or the template does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/normalized-descriptions/{id}/status:
    patch:
      operationId: UpdateNormalizedDescriptionStatus
      tags: [NormalizedDescriptions]
      summary: Update the status of a normalized description
      description: |
        Flips a NormalizedDescription between Active and PendingReview. Returns
        204 when the status was changed and 404 when the row does not exist or
        already has the requested status. Admin-only.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNormalizedDescriptionStatusRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found

  /api/normalized-descriptions/{id}/rename:
    patch:
      operationId: RenameNormalizedDescription
      tags: [NormalizedDescriptions]
      summary: Set or clear a normalized description's display label
      description: |
        Changes only the display label â€” never `canonicalName`, and never the embedding.
        Renaming is cosmetic by construction, so it cannot change which receipt text resolves
        to this row. Send `displayLabel: null` to clear the label and fall back to showing the
        matched text. Admin-only.

        Returns 409 when another row already displays the requested name, compared
        case-insensitively against each row's effective display name (its label if set,
        otherwise its matched text).
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameNormalizedDescriptionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedDescriptionResponse"
        "400":
          description: Bad Request â€” the label is whitespace-only or longer than 200 characters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Conflict â€” another normalized description already displays that name
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


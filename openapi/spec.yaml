  # Backup
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /api/backup/import:
    post:
      operationId: ImportBackup
      tags: [Backup]
      summary: Import data from a SQLite backup file
      description: >
        Accepts a SQLite database file exported by the backup endpoint, raw or
        gzip-compressed (.db.gz), reads all entity tables, and upserts each row into the current database (insert if
        new, update if existing by ID). Requires the Admin role. The import is
        atomic â€” if any entity fails validation, the entire import is rolled back.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  $ref: "#/components/schemas/IFormFile"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportResponse"
        "400":
          description: Bad Request â€” file missing, wrong format, or validation error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Conflict â€” receipt state changed during import; reload and retry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


    SpendingByNormalizedDescriptionItem:
      type: object
      required: [canonicalName, totalAmount, currency, itemCount]
      properties:
        normalizedDescriptionId:
          type: [string, "null"]
          format: uuid
        normalizationReviewState:
          type: string
          description: Purchase evidence bucket; verified, needsReview, or excluded.
        canonicalName:
          type: string
          description: Canonical name of the normalized description, or "(Not Normalized)" for receipt items without a normalized description.
        totalAmount:
          type: number
          format: double
          description: Sum of ReceiptItem.TotalAmount for items in this bucket.
        currency:
          type: string
          description: Dominant currency across the items in this bucket.
        itemCount:
          type: integer
          format: int32
          description: Number of receipt items in this bucket.
        firstSeen:
          type: ["string", "null"]
          format: date-time
          description: Earliest receipt date among items in this bucket.
        lastSeen:
          type: ["string", "null"]
          format: date-time
          description: Latest receipt date among items in this bucket.
        status:
          oneOf:
            - $ref: "#/components/schemas/NormalizedDescriptionStatus"
            - type: "null"
          description: |
            Review status of the canonical row behind this bucket. `pendingReview` means the
            resolver grouped these items on its own and no reviewer has confirmed the grouping â€”
            clients must render the bucket as provisional rather than settled. The bucket still
            counts toward `grandTotal` either way, so the report reconciles against receipt totals
            regardless of review progress. Null for the synthetic "(Not Normalized)" bucket, which
            has no backing row.


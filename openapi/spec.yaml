    YnabTransactionCandidate:
      type: object
      required: [id, date, amount, accountId]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        amount:
          type: integer
          format: int64
        memo:
          type:
            - "null"
            - string
        payeeName:
          type:
            - "null"
            - string
        accountId:
          type: string

    YnabRateLimitStatusResponse:
      type: object
      required: [remainingRequests, maxRequests, requestsUsed]
      properties:
        remainingRequests:
          type: integer
          format: int32
          description: Number of requests remaining in the current window
        maxRequests:
          type: integer
          format: int32
          description: Maximum requests allowed per window (default 200)
        requestsUsed:
          type: integer
          format: int32
          description: Number of requests made in the current window
        windowResetAt:
          type:
            - "null"
            - string
          format: date-time
          description: When the oldest request in the window expires, null if no requests tracked
        oldestRequestAt:
          type:
            - "null"
            - string
          format: date-time
          description: Timestamp of the oldest tracked request, null if no requests

    YnabMemoSyncOutcome:
      type: string
      enum:
        [
          synced,
          alreadySynced,
          noMatch,
          ambiguous,
          currencySkipped,
          reconciledSkipped,
          failed,
        ]

    YnabSyncType:
      type: string
      enum: [memoUpdate, transactionPush]

  headers:
    X-Resource-Id:
      description: Canonical identifier of the resource
      required: false
      schema:
        type: string
        format: uuid

  parameters:
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
      description: Column name to sort by. Allowed values depend on the entity type.
    SortDirection:
      name: sortDirection
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

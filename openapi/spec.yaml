      tags: [Receipts]
      summary: Delete receipts
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
        "409":
          description: The resource changed concurrently. Reload before retrying.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/receipts/locations:
    get:
      operationId: GetReceiptLocations
      tags: [Receipts]
      summary: Get distinct receipt locations sorted by frequency
      description: |
        Returns distinct location strings from existing receipts, ordered by
        usage frequency (most-used first). Supports optional prefix filtering.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: q
          in: query
          required: false

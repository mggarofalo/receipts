openapi: 3.1.0
info:
  title: Receipts API
  version: 1.0.0
  description: |
    Receipts management API. Supports header-based versioning via the
    `api-version` header (e.g. `api-version: 1.0`). When omitted, the
    default version (currently 1.0) is assumed.

paths:
  /api/historical-reclassifications/groups:
    get:
      operationId: HistoricalReclassifications_Groups
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Browse live exact-source historical purchase groups
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 25
            default: 25
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: conflictsOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: migratedBroadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: unresolvedOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: unassignedOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: dispositionFilter
          in: query
          schema:
            $ref: '#/components/schemas/HistoricalDispositionFilter'
        - name: sort
          in: query
          description: Rank all exact-source groups by purchase count or absolute item amount in the selected currency.
          schema:
            type: string
            enum: [mostPurchases, largestAmount]
            default: mostPurchases
        - name: impactCurrency
          in: query
          description: Currency used only for the impact sum; purchases in other currencies remain in the group and count.
          schema:
            type: string
            enum: [USD]
            default: USD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalGroupPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
  /api/historical-reclassifications/groups/disposition:
    put:
      operationId: HistoricalReclassifications_SetDisposition
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags: [HistoricalReclassifications]
      summary: Set own exact-source review disposition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalDispositionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalDispositionRecord'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/activity:
    get:
      operationId: HistoricalReclassifications_Activity
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags: [HistoricalReclassifications]
      summary: List own automatic historical classification activity
      parameters:
        - name: offset
          in: query
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, format: int32, minimum: 1, maximum: 25, default: 25}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalOperationPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
  /api/historical-reclassifications:
    get:
      operationId: HistoricalReclassifications_List
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags: [HistoricalReclassifications]
      summary: List own recent historical operations for resumption
      parameters:
        - name: offset
          in: query
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, format: int32, minimum: 1, maximum: 25, default: 25}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalOperationPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
    post:
      operationId: HistoricalReclassifications_Preview
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Capture an exact historical classification preview
      parameters:
        - name: api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalPreviewBody'
          text/json:
            schema:
              $ref: '#/components/schemas/HistoricalPreviewBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/HistoricalPreviewBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalProgress'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}:
    get:
      operationId: HistoricalReclassifications_Read
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Read historical classification progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalProgress'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}/summary:
    get:
      operationId: HistoricalReclassifications_Summary
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags: [HistoricalReclassifications]
      summary: Read own captured historical operation choices and progress
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalOperationSummary'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}/items:
    get:
      operationId: HistoricalReclassifications_Items
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Read paged frozen item evidence and outcomes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 0
        - name: limit
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
            default: 100
        - name: api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalItemPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}/apply:
    post:
      operationId: HistoricalReclassifications_Apply
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Apply the next bounded preview chunk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalChunkBody'
          text/json:
            schema:
              $ref: '#/components/schemas/HistoricalChunkBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/HistoricalChunkBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalProgress'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}/cancel:
    post:
      operationId: HistoricalReclassifications_Cancel
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Cancel pending historical classification work
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalProgress'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/historical-reclassifications/{id}/undo:
    post:
      operationId: HistoricalReclassifications_Undo
      security: [{BearerAuth: []}, {ApiKey: []}]
      tags:
        - HistoricalReclassifications
      summary: Conditionally undo the next bounded applied chunk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoricalUndoBody'
          text/json:
            schema:
              $ref: '#/components/schemas/HistoricalUndoBody'
          application/*+json:
            schema:
              $ref: '#/components/schemas/HistoricalUndoBody'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalProgress'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Initial automatic undo rejects a stale taxonomy revision before saving intent or row outcomes, with problem extension code stale-undo-taxonomy. Refresh taxonomy and retry only this preflight conflict. Resumptions retain their frozen revision; other conflicts do not carry this code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/category-assistance/discovery:
    get:
      tags: [CategoryAssistance]
      summary: Read aggregate background discovery progress
      description: Discovery captures local observations only. It does not classify purchases or create categories. Disable category assistance settings to stop further discovery. Provider readiness does not authorize automatic effects.
      operationId: OrganizationDiscovery_Status
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      responses:
        "200":
          description: Current discovery context and aggregate counts, without receipt or source details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDiscoveryStatusResponse" }
        "401": { description: Authentication required }
  /api/category-assistance/status:
    get:
      tags: [CategoryAssistance]
      summary: Read capability and persisted consent
      operationId: CategoryAssistance_Status
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      responses:
        "200":
          description: Capability and consent; readiness alone does not authorize dispatch
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CategoryAssistanceStatusResponse",
                }
        "401": { description: Authentication required }
  /api/category-assistance/historical-requests:
    post:
      tags: [CategoryAssistance]
      summary: Enroll selected exact historical groups for optional assistance
      operationId: CategoryAssistance_EnrollHistorical
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryAssistanceHistoricalRequest" }
      responses:
        "200":
          description: Durable enrollment and current progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryAssistanceHistoricalProgress" }
        "400":
          description: Invalid selection or an exact group with more than 100 purchases
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { description: Authentication required }
        "403":
          description: Active receipt writer required
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: Changed context, unavailable assistance, or exhausted pending limit
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    get:
      tags: [CategoryAssistance]
      summary: List own recent historical assistance requests
      operationId: CategoryAssistance_ListHistorical
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, format: int32, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 25, default: 25 } }
      responses:
        "200":
          description: Actor scoped page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryAssistanceHistoricalPage" }
        "400":
          description: Invalid paging
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { description: Authentication required }
  /api/category-assistance/historical-requests/{operationId}:
    get:
      tags: [CategoryAssistance]
      summary: Read own historical assistance request progress
      operationId: CategoryAssistance_HistoricalProgress
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Per-group progress and suggestion attempt IDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryAssistanceHistoricalProgress" }
        "400":
          description: Invalid operation ID
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { description: Authentication required }
        "404":
          description: Request unavailable to this actor
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/category-assistance/settings:
    get:
      tags: [CategoryAssistance]
      summary: Read deployment-wide settings (Admin)
      operationId: CategoryAssistance_Settings
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      responses:
        "200":
          description: Persisted settings without credentials
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CategoryAssistanceSettings" }
        "401": { description: Authentication required }
        "403": { description: Admin required }
    put:
      tags: [CategoryAssistance]
      summary: Update audited consent and limits (Admin)
      operationId: CategoryAssistance_UpdateSettings
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CategoryAssistanceSettingsRequest" }
      responses:
        "200":
          description: Saved settings with new revision
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CategoryAssistanceSettings" }
        "400":
          {
            description: Invalid settings,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
        "401": { description: Authentication required }
        "403":
          {
            description: Admin required,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
        "409":
          {
            description: Revision changed,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
  /api/category-assistance/suggestions:
    get:
      tags: [CategoryAssistance]
      summary: Page durable review suggestions
      operationId: CategoryAssistance_Suggestions
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - {
            name: offset,
            in: query,
            schema: { type: integer, format: int32, minimum: 0, default: 0 },
          }
        - {
            name: limit,
            in: query,
            schema:
              {
                type: integer,
                format: int32,
                minimum: 1,
                maximum: 100,
                default: 25,
              },
          }
        - {
            name: review,
            in: query,
            schema:
              {
                type: string,
                enum: [active, later, left_as_is, all],
                default: active,
              },
          }
      responses:
        "200":
          description: Completed suggestions only; empty when unavailable or consent disabled
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/CategoryAssistanceSuggestionPage",
                }
        "400":
          {
            description: Invalid pagination,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
        "401": { description: Authentication required }
  /api/category-assistance/activity:
    get:
      tags: [CategoryAssistance]
      summary: Read aggregate attempt activity (Admin)
      operationId: CategoryAssistance_Activity
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      responses:
        "200":
          description: Counts and today's global dispatch usage
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CategoryAssistanceActivity" }
        "401": { description: Authentication required }
        "403": { description: Admin required }
  /api/category-assistance/suggestions/{attemptId}:
    get:
      tags: [CategoryAssistance]
      summary: Read one durable category suggestion for review
      operationId: CategoryAssistance_Suggestion
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - {
            name: attemptId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: Completed suggestion,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/CategoryAssistanceSuggestionRead",
                      },
                  },
              },
          }
        "401": { description: Authentication required }
        "404":
          {
            description: Suggestion unavailable,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
  /api/category-assistance/suggestions/{attemptId}/items:
    get:
      tags: [CategoryAssistance]
      summary: Page eligible receipt items for a suggestion
      operationId: CategoryAssistance_EligibleItems
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - {
            name: attemptId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, format: int32, minimum: 0, default: 0 },
          }
        - {
            name: limit,
            in: query,
            schema:
              {
                type: integer,
                format: int32,
                minimum: 1,
                maximum: 100,
                default: 25,
              },
          }
      responses:
        "200":
          {
            description: Eligible item IDs,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/CategoryAssistanceEligibleItemPage",
                      },
                  },
              },
          }
        "400":
          {
            description: Invalid pagination,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
        "401": { description: Authentication required }
        "404":
          {
            description: Suggestion missing,
            content:
              {
                application/problem+json:
                  { schema: { $ref: "#/components/schemas/ProblemDetails" } },
              },
          }
  /api/category-assistance/review-preferences:
    get:
      tags: [CategoryAssistance]
      summary: List the current actor's saved review decisions
      operationId: CategoryAssistance_SavedReviewPreferences
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Saved review decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryAssistanceSavedReviewPage" }
        "400":
          description: Invalid pagination
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { description: Authentication required }
        "403":
          description: Active writer required
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/category-assistance/review-preferences/{attemptId}:
    put:
      tags: [CategoryAssistance]
      summary: Change a saved review decision or remove its exclusions
      description: Retained exclusions must be a subset of the existing saved exclusions. No provider attempt is required.
      operationId: CategoryAssistance_UpdateSavedReviewPreference
      security: [{ BearerAuth: [] }, { ApiKey: [] }]
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryAssistanceReviewPreferenceRequest" }
      responses:
        "200":
          description: Saved actor review state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryAssistanceReviewPreference" }
        "400":
          description: Invalid review preference
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { description: Authentication required }
        "403":
          description: Active writer required
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: Saved decision missing
          content:

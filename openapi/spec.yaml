  /api/cards/merge:
    post:
      operationId: MergeCards
      tags: [Cards]
      summary: Merge cards into a target account
      description: >
        Repoints the listed cards (and their transactions) to the target account
        and deletes any now-orphaned accounts. Requires the Admin role. Returns
        409 Conflict when mappings differ within one YNAB budget; resubmit with
        `ynabMappingWinnerAccountId` to resolve. Conflicts in multiple budgets
        return 400 and require obsolete mappings to be removed first.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCardsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeCardsResponse"
        "400":
          description: >
            Bad Request â€” invalid merge selection, or conflicting mappings in multiple
            YNAB budgets that the single-winner request cannot resolve. Remove obsolete
            mappings until at most one budget conflicts, then retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found â€” target account or source card missing
        "409":
          description: Conflict â€” source accounts have differing YNAB mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeCardsConflictResponse"

  /api/cards/merge/preview:
    post:
      operationId: PreviewMergeCards
      tags: [Cards]
      summary: Preview what a card merge would do
      description: >
        Runs the merge's validation and reports its impact without writing anything.
        Merging is irreversible: it repoints every transaction of each source account,
        including soft-deleted ones, and then deletes those accounts. Requires the
        Admin role. Rejects exactly what the merge itself would reject, so a preview
        never promises an outcome the merge would refuse to deliver.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeCardsPreviewRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeCardsPreviewResponse"
        "400":
          description: >
            Bad Request â€” invalid merge selection, or conflicting mappings in multiple
            YNAB budgets that must be reduced before the merge can be previewed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Not Found â€” target account or source card missing


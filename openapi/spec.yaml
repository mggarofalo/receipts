      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/NormalizationSourceKey"
        query:
          type: [string, "null"]
          maxLength: 200
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
          default: 20


      tags: [ReceiptItems]
      summary: Get all receipt items
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: receiptId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDirection"
        - name: q
          in: query
          required: false
          description: Case-insensitive substring filter applied across Description, ReceiptItemCode, and the item type path (including ancestors). Whitespace-only values are ignored. Ignored when receiptId is supplied.
          schema:
            type: string
        - name: normalizedDescriptionId
          in: query
          required: false
          description: |
            Restricts the page to receipt items linked to this canonical NormalizedDescription.
            Combines with `q`; ignored when `receiptId` is supplied. An empty GUID is rejected
            with 400 rather than treated as "no filter". Backed by an index, so this is the
            supported way to enumerate one entry's items rather than paging the whole table.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:

  /api/reports/item-cost-over-time:
    get:
      operationId: GetItemCostOverTime
      tags: [Reports]
      summary: Get item cost over time
      description: Returns unit-price observations for an item description, normalized description, or stable category subtree. Buckets are separated by currency. Category assignments default to their historical as-classified view.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: description
          in: query
          required: false
          schema:
            type: string
          description: Raw item description to filter by. Takes precedence over normalizedDescription and categoryId.
        - name: normalizedDescription
          in: query
          required: false
          schema:
            type: string
          description: Normalized description canonical name to filter by. Takes precedence over categoryId.
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Stable taxonomy category ID. Includes descendants in the selected category view.
        - name: categoryView
          in: query
          required: false
          schema:
            type: string
            enum: [asClassified, currentHierarchy]
            default: asClassified
          description: Historical assignment hierarchy or hierarchy at capturedCurrentRevisionId (current head when omitted).
        - name: knowledgeCutoff
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: ISO UTC timestamp ending in Z. Selects the latest assignment recorded at or before this time.
        - name: capturedCurrentRevisionId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Captured taxonomy revision for currentHierarchy; rejected with asClassified.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date (ISO date string). Defaults to no lower bound.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (ISO date string). Defaults to no upper bound.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [exact, monthly, yearly]
            default: exact
          description: Time bucket granularity. "exact" returns each purchase date.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCostOverTimeResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/reports/duplicates:
    get:
      operationId: GetDuplicateDetectionReport
      tags: [Reports]
      summary: Get duplicate receipt detection report
      description: Finds receipts that share the same date+location, date+total, or all three fields and may be double entries.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: matchOn
          in: query
          required: false
          schema:
            type: string
            enum: [dateAndLocation, dateAndTotal, dateAndLocationAndTotal]
            default: dateAndLocation
          description: Which fields to compare when detecting duplicates.
        - name: locationTolerance
          in: query
          required: false
          schema:
            type: string
            enum: [exact, normalized]
            default: exact
          description: "How to compare locations: exact (case-sensitive) or normalized (trimmed, lowercased, whitespace-collapsed)."
        - name: totalTolerance
          in: query
          required: false
          schema:
            type: number
            format: double
            default: 0
            minimum: 0
          description: Maximum difference between transaction totals to still consider them matching. Default 0 (exact match).
        - name: includeAccepted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, groups previously accepted as "not a duplicate" are included and flagged with isAccepted. Default false (accepted groups are omitted).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatesResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/reports/duplicates/accepted:
    get:
      operationId: GetAcceptedDuplicates
      tags: [Reports]
      summary: List accepted duplicate groups
      description: Returns the receipt groups a user has accepted as genuinely separate purchases. Groups are the connected components of the accepted-pair graph, hydrated with the receipts that are still active.
      security:
        - BearerAuth: []
        - ApiKey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedDuplicatesResponse"
    post:
      operationId: AcceptDuplicateGroup
      tags: [Reports]
      summary: Accept a duplicate group as not-a-duplicate
      description: Records every unordered pair of the supplied receipts as "not a duplicate" so the group stops being reported. Idempotent â€” re-accepting an already-accepted group is a no-op.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDuplicateGroupRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptDuplicateGroupResponse"
        "404":
          description: One or more receipts were not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/reports/duplicates/accepted/remove:
    post:
      operationId: UnacceptDuplicateGroup
      tags: [Reports]
      summary: Undo a duplicate-group acceptance
      description: >
        Removes the "not a duplicate" assertion between every pair of the supplied receipts, and
        only those pairs â€” the server does not expand the request. The caller must therefore submit
        every member of the group it wants undone: send the group's memberReceiptIds from
        GET /api/reports/duplicates/accepted, not the receipts it displayed, or the pairs touching a
        member whose receipt was deleted are left stored with no way to reach them again. To un-accept
        just one reported cluster instead, send that cluster's receipts.
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnacceptDuplicateGroupRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnacceptDuplicateGroupResponse"

  /api/reports/category-trends:
    get:
      operationId: GetCategoryTrendsReport
      tags: [Reports]
      summary: Get category spending trends over time
      description: Returns time-series spending data broken down by category. Categories beyond the topN threshold are collapsed into "Other". Buckets are dense and zero-filled.
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Start date (ISO date string). Defaults to all time.
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (ISO date string). Defaults to today.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [daily, monthly, quarterly, yearly]
            default: monthly
          description: Time bucket granularity.
        - name: topN
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 7
          description: Number of top categories to show. Remaining categories are collapsed into "Other".
        - name: categoryView
          in: query
          required: false
          description: Classification view. Defaults to asClassified.
          schema:
            type: string
            enum: [asClassified, currentHierarchy]
            default: asClassified
        - name: rollup
          in: query
          required: false
          description: Bucket level. Defaults to assignedCategory.
          schema:
            type: string
            enum: [assignedCategory, root]
            default: assignedCategory
        - name: categoryId
          in: query
          required: false
          description: Include this category and descendants in the selected view.
          schema:
            type: string
            format: uuid
        - name: knowledgeCutoff
          in: query
          required: false
          description: Inclusive UTC classification knowledge cutoff with Z suffix. Financial facts remain current.
          schema:
            type: string
            format: date-time
        - name: capturedCurrentRevisionId
          in: query
          required: false
          description: Reuse an existing immutable revision; requires currentHierarchy.
          schema:
            type: string
            format: uuid
        - name: envelopeId
          in: query
          required: false
          description: Only purchases recorded with this envelope.
          schema:
            type: string
            format: uuid
        - name: occasionId
          in: query
          required: false
          description: Only purchases tagged with this occasion.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryTrendsResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"


services:
  init:
    image: alpine:3.21
    container_name: receipts-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for secret in pg_password jwt_key admin_password; do
          if [ ! -f "/secrets/$${secret}" ]; then
            if [ "$${secret}" = "admin_password" ]; then
              pw=$$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 44)
              sym=$$(tr -dc '!@#%&*' < /dev/urandom | head -c 2)
              digit=$$(tr -dc '0-9' < /dev/urandom | head -c 1)
              upper=$$(tr -dc 'A-Z' < /dev/urandom | head -c 1)
              printf '%s%s%s%s' "$${pw}" "$${sym}" "$${digit}" "$${upper}" > "/secrets/$${secret}"
            else
              tr -dc 'A-Za-z0-9+/' < /dev/urandom | head -c 48 > "/secrets/$${secret}"
            fi
            chmod 644 "/secrets/$${secret}"
            echo "Generated /secrets/$${secret}"
          else
            echo "/secrets/$${secret} already exists, skipping"
          fi
        done
        echo "Secrets ready"
    volumes:
      - secrets:/secrets
    networks: []

  db:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: receipts-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=receipts
      - POSTGRES_PASSWORD_FILE=/secrets/pg_password
      - POSTGRES_DB=receipts
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - secrets:/secrets:ro
      - db-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipts -d receipts"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - receipts-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app:
    image: ghcr.io/mggarofalo/receipts:${IMAGE_TAG:-latest}
    container_name: receipts-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1654
      - PGID=1654
      - TZ=America/New_York
      - ASPNETCORE_ENVIRONMENT=Production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=receipts
      - POSTGRES_DB=receipts
      - Jwt__Issuer=receipts-api
      - Jwt__Audience=receipts-app
      - AdminSeed__Email=admin@example.com
      - AdminSeed__FirstName=Admin
      - AdminSeed__LastName=User
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_BACKEND_DSN=${SENTRY_BACKEND_DSN:-}
      # Telemetry is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set. To send traces,
      # metrics and logs to an external OTel collector, uncomment this block and see
      # docs/observability.md. The header is a secret: keep the real value out of git.
      # - OTEL_SERVICE_NAME=receipts-api
      # - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.example.com
      # - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # - OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic <base64 of app:secret>
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro
      - app-data:/data
      # Private rotating OAuth credentials; exclude this volume from ordinary backups.
      - chatgpt-auth:/data/chatgpt
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # BGE-large ONNX model (~1.34 GB) is mmap'd into the singleton
          # InferenceSession; keep headroom for .NET runtime + request load.
          # The model itself is not in the image — it is downloaded into app-data
          # at /data/models on first start, so budget ~1.4 GB of disk there too
          # and expect semantic features to lag the first boot (RECEIPTS-929).
          memory: 3G
          cpus: "2"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - receipts-net
      # Same-host collector: uncomment, and the external network below, then use
      # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318.
      # - observability
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  secrets:
  db-data:
  app-data:
  chatgpt-auth:

networks:
  receipts-net:
    driver: bridge
  # Same-host collector only. The monitoring stack creates this network; compose
  # fails to start if it is declared here and does not exist.
  # observability:
  #   external: true
